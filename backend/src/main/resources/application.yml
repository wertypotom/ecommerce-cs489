spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5434}/${DB_NAME:ecommerce_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8082}
