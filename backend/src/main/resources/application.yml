spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ecommerce_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:Y29tLWVjb21tZXJjZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1hdC1sZWFzdC0yNTYtYml0cw==}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8085}
